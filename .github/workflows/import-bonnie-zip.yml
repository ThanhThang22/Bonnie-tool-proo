name: Import BONNIE TOOL PRO ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'BONNIE_TOOL_PRO_SOURCE(1).zip'

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and extract the seven source files
        shell: bash
        run: |
          set -euo pipefail
          ZIP='BONNIE_TOOL_PRO_SOURCE(1).zip'
          test -f "$ZIP" || { echo "ZIP not found at repository root: $ZIP"; exit 1; }

          expected='app.js
index.html
style.css
sw.js
manifest.webmanifest
cat-icon.svg
README.txt'

          mkdir -p /tmp/bonnie-import
          unzip -q "$ZIP" -d /tmp/bonnie-import

          source_dir='/tmp/bonnie-import/Bonnie_Tool_Pro'
          test -d "$source_dir" || { echo 'Expected folder Bonnie_Tool_Pro was not found in ZIP'; exit 1; }

          actual="$(find "$source_dir" -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected_sorted="$(printf '%s\n' "$expected" | sort)"
          diff -u <(printf '%s\n' "$expected_sorted") <(printf '%s\n' "$actual")

          for file in $expected; do
            test -s "$source_dir/$file" || { echo "Missing or empty file: $file"; exit 1; }
            cp "$source_dir/$file" "./$file"
          done

          node --check ./app.js

      - name: Commit extracted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css sw.js manifest.webmanifest cat-icon.svg README.txt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Import BONNIE TOOL PRO source files from ZIP"
            git push
          fi
